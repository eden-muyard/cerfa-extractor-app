<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Extractor — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3dd6c3;
      --accent-dim: rgba(61, 214, 195, 0.12);
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-text: #fca5a5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(61, 214, 195, 0.18), transparent),
        var(--bg);
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: grid;
      place-items: center;
      font-size: 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hint {
      color: var(--muted);
      margin: 0 0 1.25rem;
      font-size: 0.9rem;
    }

    .error {
      background: var(--danger-bg);
      color: var(--danger-text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    form { display: grid; gap: 0.85rem; }

    input {
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #232d3b;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }

    input:focus {
      outline: none;
      border-color: rgba(61, 214, 195, 0.5);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    button {
      border: 0;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #2eb8a8);
      color: #0f1419;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.25rem;
    }

    button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="logo" aria-hidden="true">⬡</div>
      <h1>Database Extractor</h1>
    </div>
    <p class="hint">Businove team login required.</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="text" name="username" placeholder="Username" required autocomplete="username">
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
